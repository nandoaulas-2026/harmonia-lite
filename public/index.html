<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmonia — Protótipo & IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121316;
    --bg-raised: #1B1D22;
    --bg-panel: #202329;
    --hairline: #33363D;
    --ink: #F0EDE6;
    --ink-dim: #9A9CA3;
    --ink-faint: #5C5E66;
    --brass: #E8A33D;
    --brass-dim: #7A5A28;
    --sage: #5FA8A0;
    --danger: #D9695F;
    --radius: 14px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-score: 'Source Serif 4', Georgia, serif;
    --paper-bg: #FBFAF6;
    --paper-ink: #1E1C18;
    --paper-ink-dim: #6B6A63;
    --paper-line: #8A887F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: #0B0C0E;
    font-family: var(--font-body);
    color: var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 16px 80px;
  }
  .lab-note{
    color: var(--ink-faint);
    font-size: 12px;
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .device{
    width: 390px;
    max-width: 100%;
    background: var(--bg);
    border-radius: 34px;
    border: 1px solid #2A2C32;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.7);
    overflow:hidden;
    position:relative;
  }
  .mode-toggle{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .mode-toggle button{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing:0.03em;
    text-transform: uppercase;
    background: var(--bg-raised);
    color: var(--ink-dim);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 8px 16px;
    cursor:pointer;
  }
  .mode-toggle button.active{
    background: var(--brass);
    color: #1B1300;
    border-color: var(--brass);
  }

  /* ===== Screen chrome ===== */
  .statusbar{
    height: 34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 0 22px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
  }
  .song-header{
    padding: 4px 20px 14px;
    border-bottom: 1px solid var(--hairline);
  }
  .song-header .eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 4px;
  }
  .song-header h1{
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .song-header .artist{
    color: var(--ink-dim);
    font-size: 13px;
  }
  .song-header .meta-row{
    display:flex;
    gap:10px;
    margin-top:10px;
    align-items:center;
  }

  .screen-body{
    height: 100%;
    overflow-y: auto;
    padding: 18px 20px 100px;
    position: relative;
  }
  .screen-body::-webkit-scrollbar{ width: 3px; }
  .screen-body::-webkit-scrollbar-thumb{ background: var(--hairline); }

  .section-label{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--sage);
    margin: 22px 0 10px;
  }
  .section-label:first-child{ margin-top: 4px; }

  .lyric-line{
    font-size: 17px;
    line-height: 1.85;
    color: var(--ink);
  }

  .chord-line{
    display:flex;
    flex-wrap:wrap;
    margin-bottom: 26px;
  }
  .chunk{
    position: relative;
    padding-top: 22px;
    font-size: 17px;
    line-height: 1.4;
    white-space: pre;
  }
  .chunk .chord{
    position:absolute;
    top:0;
    left:0;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13px;
    color: var(--brass);
  }

  .transpose-bar{
    position:absolute;
    bottom: 18px;
    left: 20px;
    right: 20px;
    background: var(--bg-panel);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 10px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    backdrop-filter: blur(6px);
  }
  .transpose-bar .label{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .transpose-controls{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .transpose-controls button{
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--hairline);
    background: var(--bg-raised);
    color: var(--ink);
    font-size: 16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .transpose-controls button:active{ background: var(--brass); color:#1B1300; }
  .transpose-value{
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 600;
    min-width: 34px;
    text-align:center;
  }

  .staff-scale-outer{
    width: 100%;
    overflow: hidden;
    position: relative;
  }
  .staff-wrap{
    display: inline-block;
    background: var(--paper-bg);
    border-radius: 10px;
    padding: 20px 8px 14px;
    box-shadow: 0 8px 24px -8px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(0,0,0,0.06);
    transform-origin: top left;
  }
  .staff-system{
    margin-bottom: 4px;
  }
  .staff-legend{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-top: 12px;
    padding: 0 4px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
  }
  .staff-legend span{ display:flex; align-items:center; gap:5px; }

  .format-selector{
    display:flex;
    flex-wrap: wrap;
    gap:6px;
    margin-top: 12px;
  }
  .format-selector button{
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--bg-raised);
    color: var(--ink-dim);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 6px 12px;
    cursor:pointer;
    white-space: nowrap;
  }
  .format-selector button.active{
    background: var(--brass);
    color: #1B1300;
    border-color: var(--brass);
  }

  /* Tela Adicionar / Enviar Áudio */
  .add-screen{ padding: 26px 20px 100px; }
  .add-screen .eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 6px;
  }
  .add-screen h1{
    font-family: var(--font-display);
    font-size: 24px;
    margin: 0 0 6px;
  }
  .add-screen p.sub{
    color: var(--ink-dim);
    font-size: 13.5px;
    line-height: 1.5;
    margin: 0 0 26px;
  }
  .file-drop-box{
    background: var(--bg-raised);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .file-drop-box span {
    font-size: 13px;
    color: var(--ink-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 220px;
  }
  .file-drop-box button{
    background: transparent;
    border: none;
    color: var(--brass);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .generate-btn{
    width:100%;
    background: var(--brass);
    color: #1B1300;
    border: none;
    border-radius: var(--radius);
    padding: 15px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14.5px;
    cursor:pointer;
  }
  .generate-btn:disabled{ opacity: 0.6; cursor:default; }
  .error-box{
    margin-top: 14px;
    background: rgba(217, 105, 95, 0.15);
    border: 1px solid var(--danger);
    color: #ff9e96;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="lab-note">Harmonia — protótipo de tela · deslize / clique para interagir</div>
  <div class="mode-toggle" id="deviceToggle">
    <button class="active" data-mode="phone">Celular</button>
    <button data-mode="tablet">Tablet</button>
    <button data-mode="add">+ Nova música</button>
  </div>
  <div class="device" id="device"></div>

<script>
let SONG = {
  title: "Deixa a Luz Entrar",
  artist: "Demonstração",
  originalKey: "G",
  bpm: 92,
  lyricSections: [
    { label: "Verso 1", lines: ["Deixa a luz entrar pela janela", "O dia começa e eu começo nela"] },
    { label: "Refrão", lines: ["E se o mundo cansa, eu vou de novo"] }
  ],
  chordLines: [
    [ {chord:"G", text:"Deixa a "}, {chord:"Em", text:"luz entrar"} ],
    [ {chord:"C", text:"E se o mundo "}, {chord:"D", text:"cansa"} ]
  ],
  measures: [
    {chord:"G", section:null, cue:null, doubleBarAfter:false},
    {chord:"Em", section:null, cue:null, doubleBarAfter:true},
    {chord:"C", section:"Refrão", cue:null, doubleBarAfter:false},
    {chord:"D", section:null, cue:null, doubleBarAfter:true}
  ]
};

let transposeAmount = 0;
let deviceMode = "phone";
let selectedFormats = ["letra"];
let selectedFile = null;
let errorMessage = "";
let isProcessing = false;

// ================= COMPRESSÃO DE ÁUDIO NO NAVEGADOR =================
async function comprimirAudioAntesDoEnvio(file) {
  const arrayBuffer = await file.arrayBuffer();
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

  const targetSampleRate = 16000;
  const numChannels = 1; // Mono reduz o tamanho drasticamente
  const offlineCtx = new OfflineAudioContext(
    numChannels, 
    audioBuffer.duration * targetSampleRate, 
    targetSampleRate
  );

  const source = offlineCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(offlineCtx.destination);
  source.start(0);

  const renderedBuffer = await offlineCtx.startRendering();
  const wavBlob = audioBufferToWav(renderedBuffer, targetSampleRate);
  
  return new File([wavBlob], file.name.replace(/\.[^/.]+$/, "") + "_comprimido.wav", { type: "audio/wav" });
}

function audioBufferToWav(buffer, sampleRate) {
  const numOfChan = buffer.numberOfChannels;
  const length = buffer.length * numOfChan * 2 + 44;
  const out = new DataView(new ArrayBuffer(length));
  let channels = [];
  let offset = 0;
  let pos = 0;

  function writeString(str) { for (let i = 0; i < str.length; i++) { out.setUint8(pos++, str.charCodeAt(i)); } }
  function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
  function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

  writeString('RIFF'); setUint32(length - 8); writeString('WAVE');
  writeString('fmt '); setUint32(16); setUint16(1); setUint16(numOfChan);
  setUint32(sampleRate); setUint32(sampleRate * 2 * numOfChan);
  setUint16(numOfChan * 2); setUint16(16);
  writeString('data'); setUint32(length - pos - 4);

  for (let i = 0; i < buffer.numberOfChannels; i++) { channels.push(buffer.getChannelData(i)); }
  while (pos < length) {
    for (let i = 0; i < numOfChan; i++) {
      let sample = Math.max(-1, Math.min(1, channels[i][offset]));
      sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
      out.setInt16(pos, sample, true);
      pos += 2;
    }
    offset++;
  }
  return new Blob([out.buffer], { type: 'audio/wav' });
}

// ================= RENDERIZADORES =================
function transposeChord(chord, semitones){
  if(!chord) return chord;
  const CHROMATIC = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const m = chord.match(/^([A-G]#?)(.*)$/);
  if(!m) return chord;
  const [ , root, suffix ] = m;
  const idx = CHROMATIC.indexOf(root);
  if(idx === -1) return chord;
  return CHROMATIC[(idx + semitones + 120) % 12] + suffix;
}

function renderLetra(){
  let html = "";
  SONG.lyricSections.forEach(sec => {
    html += `<div class="section-label">${sec.label}</div>`;
    sec.lines.forEach(l => { html += `<div class="lyric-line">${l}</div>`; });
  });
  return html;
}

function renderCifra(){
  let html = "";
  SONG.chordLines.forEach(line => {
    html += `<div class="chord-line">`;
    line.forEach(chunk => {
      const shown = transposeChord(chunk.chord, transposeAmount);
      html += `<span class="chunk"><span class="chord">${shown}</span>${chunk.text || "&nbsp;"}</span>`;
    });
    html += `</div>`;
  });
  return html;
}

function chunkMeasures(measuresPerSystem){
  const out = [];
  for(let i=0; i<SONG.measures.length; i += measuresPerSystem){
    out.push({ startIndex: i, items: SONG.measures.slice(i, i + measuresPerSystem) });
  }
  return out;
}

function buildStaffSystemSVG(system, systemIdx, measuresPerSystem){
  const MW = 96, CLEF_W = 42, staffTop = 26, staffBottom = 62, staffMid = 44;
  const w = CLEF_W + system.items.length * MW + 14, h = 102;
  const INK = "#1E1C18", INK_DIM = "#6B6A63", LINE = "#8A887F", SERIF = "Source Serif 4, Georgia, serif";
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block; max-width:${w}px;">`;

  for(let i=0;i<5;i++){
    svg += `<line x1="${CLEF_W-6}" y1="${staffTop + i * 9}" x2="${w-6}" y2="${staffTop + i * 9}" stroke="${LINE}" stroke-width="1"/>`;
  }
  svg += `<text x="4" y="${staffBottom+2}" font-size="40" fill="${INK}">𝄞</text>`;
  svg += `<text x="30" y="${staffTop+16}" font-size="13" fill="${INK}">♯</text>`;
  if(systemIdx === 0){
    svg += `<text x="30" y="${staffMid-2}" font-family="${SERIF}" font-size="12" font-weight="700" fill="${INK}">4</text>`;
    svg += `<text x="30" y="${staffMid+11}" font-family="${SERIF}" font-size="12" font-weight="700" fill="${INK}">4</text>`;
  }
  svg += `<text x="${CLEF_W-6}" y="13" font-family="${SERIF}" font-style="italic" font-size="11" fill="${INK_DIM}">${system.startIndex+1}</text>`;
  svg += `<line x1="${CLEF_W-6}" y1="${staffTop}" x2="${CLEF_W-6}" y2="${staffBottom}" stroke="${INK}" stroke-width="1.3"/>`;

  system.items.forEach((m, i) => {
    const x0 = CLEF_W + i * MW;
    const shownChord = transposeChord(m.chord, transposeAmount);
    if(m.section){
      const boxW = 14 + m.section.length * 6.4;
      svg += `<rect x="${x0+4}" y="1" width="${boxW}" height="14" fill="none" stroke="${INK}" stroke-width="1"/>`;
      svg += `<text x="${x0+4+boxW/2}" y="11" font-family="${SERIF}" font-size="10" fill="${INK}" text-anchor="middle">${m.section}</text>`;
    }
    svg += `<text x="${x0+8}" y="20" font-family="${SERIF}" font-weight="700" font-size="15" fill="${INK}">${shownChord}</text>`;
    for(let b=0;b<4;b++){
      const bx = x0 + 20 + b * (MW-30)/3;
      svg += `<line x1="${bx-5}" y1="${staffMid+7}" x2="${bx+5}" y2="${staffMid-7}" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>`;
    }
    const xEnd = x0 + MW;
    if(m.doubleBarAfter){
      svg += `<line x1="${xEnd-10}" y1="${staffTop}" x2="${xEnd-10}" y2="${staffBottom}" stroke="${INK}" stroke-width="1"/>`;
      svg += `<line x1="${xEnd-6}" y1="${staffTop}" x2="${xEnd-6}" y2="${staffBottom}" stroke="${INK}" stroke-width="2.4"/>`;
    } else {
      svg += `<line x1="${xEnd-6}" y1="${staffTop}" x2="${xEnd-6}" y2="${staffBottom}" stroke="${INK}" stroke-width="1"/>`;
    }
    if(m.cue){
      svg += `<text x="${x0+8}" y="${staffBottom+16}" font-family="${SERIF}" font-style="italic" font-size="9" fill="${INK_DIM}">${m.cue}</text>`;
    }
  });
  svg += `</svg>`;
  return svg;
}

function renderGrade(){
  const systems = chunkMeasures(4);
  let html = `<div class="staff-scale-outer"><div class="staff-wrap">`;
  systems.forEach((sys, idx) => { html += `<div class="staff-system">${buildStaffSystemSVG(sys, idx, 4)}</div>`; });
  html += `</div></div><div class="staff-legend"><span>╱╱╱ toque no ritmo</span><span>▭ seção</span></div>`;
  return html;
}

function fitStaffPages(){
  requestAnimationFrame(() => {
    document.querySelectorAll(".staff-scale-outer").forEach(outer => {
      const page = outer.querySelector(".staff-wrap");
      if(!page) return;
      page.style.transform = "scale(1)";
      const naturalWidth = page.offsetWidth;
      if(!naturalWidth) return;
      let scale = Math.max(0.5, Math.min(1.3, outer.clientWidth / naturalWidth));
      page.style.transform = `scale(${scale})`;
      outer.style.height = (page.offsetHeight * scale) + "px";
    });
  });
}

function renderAddScreen(){
  const device = document.getElementById("device");
  device.style.width = "390px";
  device.innerHTML = `
    <div class="statusbar"><span>9:41</span><span>♪ Harmonia</span></div>
    <div class="add-screen">
      <div class="eyebrow">Nova música · IA</div>
      <h1>Envie o áudio da música</h1>
      <p class="sub">Selecione o ficheiro de áudio. O app comprime-o automaticamente e a IA gera a letra, cifra e grade rítmica.</p>
      
      <input type="file" id="audioFileInput" accept="audio/*" style="display:none" onchange="onFileSelected(event)">
      <div class="file-drop-box">
        <span>${selectedFile ? selectedFile.name + " (" + (selectedFile.size/(1024*1024)).toFixed(1) + "MB)" : "Nenhum ficheiro selecionado"}</span>
        <button onclick="document.getElementById('audioFileInput').click()">Escolher</button>
      </div>

      <button class="generate-btn" onclick="startProcessing()" ${isProcessing || !selectedFile ? "disabled" : ""}>
        ${isProcessing ? "A processar áudio..." : "Gerar cifra com IA"}
      </button>

      ${errorMessage ? `<div class="error-box">${errorMessage}</div>` : ""}
    </div>
  `;
}

function onFileSelected(e){
  selectedFile = e.target.files[0];
  errorMessage = "";
  renderAddScreen();
}

async function startProcessing(){
  if(!selectedFile) return;
  isProcessing = true;
  errorMessage = "";
  renderAddScreen();

  try {
    // 1. Comprime no navegador
    const arquivoComprimido = await comprimirAudioAntesDoEnvio(selectedFile);

    // 2. Envia para o servidor da Vercel
    const formData = new FormData();
    formData.append("audio", arquivoComprimido);

    const response = await fetch("/api/analisar", {
      method: "POST",
      body: formData
    });

    if(!response.ok) {
      const errJson = await response.json().catch(() => ({}));
      throw new Error(errJson.error || "Erro no servidor ao processar o áudio.");
    }

    const data = await response.json();
    SONG = data; // Atualiza a música com os dados reais gerados pela IA!
    
    // Volta para o modo de exibição normal
    deviceMode = "phone";
    selectedFormats = ["letra"];
    document.querySelectorAll("#deviceToggle button").forEach(b => {
      b.classList.toggle("active", b.dataset.mode === "phone");
    });
    render();

  } catch (err) {
    errorMessage = err.message;
  } finally {
    isProcessing = false;
    renderAddScreen();
  }
}

const FORMAT_PRESETS = [
  { key:"letra", label:"Letra", formats:["letra"] },
  { key:"cifra", label:"Cifra", formats:["cifra"] },
  { key:"grade", label:"Grade", formats:["grade"] },
  { key:"letra_cifra", label:"Letra + Cifra", formats:["letra","cifra"] },
  { key:"letra_grade", label:"Letra + Grade", formats:["letra","grade"] },
  { key:"cifra_grade", label:"Cifra + Grade", formats:["cifra","grade"] },
  { key:"todas", label:"Todas juntas", formats:["letra","cifra","grade"] },
];
const PANE_LABELS = { letra:"Letra", cifra:"Cifra", grade:"Grade rítmica" };
const PANE_RENDERERS = { letra:renderLetra, cifra:renderCifra, grade:renderGrade };

function formatSelectorHTML(){
  return `<div class="format-selector">${FORMAT_PRESETS.map(p => {
    const isActive = JSON.stringify(p.formats) === JSON.stringify(selectedFormats);
    return `<button class="${isActive ? "active" : ""}" onclick='setFormats(${JSON.stringify(p.formats)})'>${p.label}</button>`;
  }).join("")}</div>`;
}

function setFormats(formats){
  selectedFormats = formats;
  render();
}

function renderPanesHTML(formats, direction){
  const isSingle = formats.length === 1;
  let html = `<div style="display:flex; flex-direction:${direction}; height:100%;">`;
  formats.forEach((f, i) => {
    const border = (i < formats.length - 1) ? (direction === "row" ? "border-right:1px solid var(--hairline);" : "border-bottom:1px solid var(--hairline);") : "";
    html += `<div style="flex:1; min-width:0; min-height:0; ${border}">
      ${!isSingle ? `<div style="font-family:var(--font-mono); font-size:10px; text-transform:uppercase; color:var(--ink-faint); padding:10px 20px 0;">${PANE_LABELS[f]}</div>` : ""}
      <div class="screen-body">${PANE_RENDERERS[f]()}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderPhone(){
  const device = document.getElementById("device");
  device.style.width = "390px";
  const direction = selectedFormats.length > 1 ? "column" : "row";
  device.innerHTML = `
    <div class="statusbar"><span>9:41</span><span>♪ Harmonia</span></div>
    <div class="song-header">
      <div class="eyebrow">Cifra sincronizada · IA</div>
      <h1>${SONG.title}</h1>
      <div class="artist">${SONG.artist} · Tom: ${transposeChord(SONG.originalKey, transposeAmount)} · ${SONG.bpm} BPM</div>
      ${formatSelectorHTML()}
    </div>
    <div style="height:460px;">${renderPanesHTML(selectedFormats, direction)}</div>
    ${(selectedFormats.includes("cifra") || selectedFormats.includes("grade")) ? `
      <div class="transpose-bar">
        <div><div class="label">Tom atual</div><div class="transpose-value">${transposeChord(SONG.originalKey, transposeAmount)}</div></div>
        <div class="transpose-controls">
          <button onclick="changeTranspose(-1)">−</button>
          <div class="transpose-value">${transposeAmount > 0 ? "+"+transposeAmount : transposeAmount}</div>
          <button onclick="changeTranspose(1)">+</button>
        </div>
      </div>` : ""}
  `;
  fitStaffPages();
}

function renderTablet(){
  const device = document.getElementById("device");
  device.style.width = "820px";
  device.innerHTML = `
    <div class="statusbar"><span>9:41</span><span>♪ Harmonia</span></div>
    <div class="song-header">
      <div class="eyebrow">Modo Estante</div>
      <h1>${SONG.title}</h1>
      <div class="artist">${SONG.artist} · Tom: ${transposeChord(SONG.originalKey, transposeAmount)} · ${SONG.bpm} BPM</div>
      ${formatSelectorHTML()}
    </div>
    <div style="height:480px;">${renderPanesHTML(selectedFormats, "row")}</div>
    ${(selectedFormats.includes("cifra") || selectedFormats.includes("grade")) ? `
      <div class="transpose-bar">
        <div><div class="label">Tom atual</div><div class="transpose-value">${transposeChord(SONG.originalKey, transposeAmount)}</div></div>
        <div class="transpose-controls">
          <button onclick="changeTranspose(-1)">−</button>
          <div class="transpose-value">${transposeAmount > 0 ? "+"+transposeAmount : transposeAmount}</div>
          <button onclick="changeTranspose(1)">+</button>
        </div>
      </div>` : ""}
  `;
  fitStaffPages();
}

function changeTranspose(delta){
  transposeAmount = Math.max(-6, Math.min(6, transposeAmount + delta));
  render();
}

function render(){
  if(deviceMode === "phone") renderPhone();
  else if(deviceMode === "tablet") renderTablet();
  else renderAddScreen();
}

document.getElementById("deviceToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if(!btn) return;
  [...document.getElementById("deviceToggle").children].forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  deviceMode = btn.dataset.mode;
  render();
});

render();
</script>
</body>
</html>
