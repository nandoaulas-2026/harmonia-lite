<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmonia — Protótipo & IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121316;
    --bg-raised: #1B1D22;
    --bg-panel: #202329;
    --hairline: #33363D;
    --ink: #F0EDE6;
    --ink-dim: #9A9CA3;
    --ink-faint: #5C5E66;
    --brass: #E8A33D;
    --brass-dim: #7A5A28;
    --sage: #5FA8A0;
    --danger: #D9695F;
    --radius: 14px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-score: 'Source Serif 4', Georgia, serif;
    --paper-bg: #FBFAF6;
    --paper-ink: #1E1C18;
    --paper-ink-dim: #6B6A63;
    --paper-line: #8A887F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: #0B0C0E;
    font-family: var(--font-body);
    color: var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 16px 80px;
  }
  .lab-note{
    color: var(--ink-faint);
    font-size: 12px;
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .device{
    width: 390px;
    max-width: 100%;
    background: var(--bg);
    border-radius: 34px;
    border: 1px solid #2A2C32;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.7);
    overflow:hidden;
    position:relative;
  }
  .mode-toggle{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .mode-toggle button{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing:0.03em;
    text-transform: uppercase;
    background: var(--bg-raised);
    color: var(--ink-dim);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 8px 16px;
    cursor:pointer;
  }
  .mode-toggle button.active{
    background: var(--brass);
    color: #1B1300;
    border-color: var(--brass);
  }

  /* ===== Screen chrome ===== */
  .statusbar{
    height: 34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 0 22px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
  }
  .song-header{
    padding: 4px 20px 14px;
    border-bottom: 1px solid var(--hairline);
  }
  .song-header .eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 4px;
  }
  .song-header h1{
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .song-header .artist{
    color: var(--ink-dim);
    font-size: 13px;
  }
  .song-header .meta-row{
    display:flex;
    gap:10px;
    margin-top:10px;
    align-items:center;
  }

  .screen-body{
    height: 100%;
    overflow-y: auto;
    padding: 18px 20px 100px;
    position: relative;
  }
  .screen-body::-webkit-scrollbar{ width: 3px; }
  .screen-body::-webkit-scrollbar-thumb{ background: var(--hairline); }

  .section-label{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--sage);
    margin: 22px 0 10px;
  }
  .section-label:first-child{ margin-top: 4px; }

  .lyric-line{
    font-size: 17px;
    line-height: 1.85;
    color: var(--ink);
  }

  .chord-line{
    display:flex;
    flex-wrap:wrap;
    margin-bottom: 26px;
  }
  .chunk{
    position: relative;
    padding-top: 22px;
    font-size: 17px;
    line-height: 1.4;
    white-space: pre;
  }
  .chunk .chord{
    position:absolute;
    top:0;
    left:0;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13px;
    color: var(--brass);
  }

  .transpose-bar{
    position:absolute;
    bottom: 18px;
    left: 20px;
    right: 20px;
    background: var(--bg-panel);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 10px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between
